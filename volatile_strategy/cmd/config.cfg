[kafka]
brokers=nats://127.0.0.1:4222
input_topic=go_ltp
input_group_id=volatile_strategy
signal_topic=signals.strategy
signal_partitions=3
commit_interval_ms=1000
startup_replay_grace_sec=120

[strategy]
timezone=Asia/Kolkata
session_start=09:15
session_end=15:30
window_minutes=5
confirm_minutes=3
retrace_pct=0.20
top_count=3

[service]
metrics_address=:9108
dashboard_path=/dashboard
