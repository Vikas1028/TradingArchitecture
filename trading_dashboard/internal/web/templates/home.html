<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.PageTitle}}</title>
  <style>
    :root {
      --bg: #f5efe6;
      --panel: rgba(255,255,255,0.78);
      --ink: #201b16;
      --muted: #71675d;
      --line: rgba(32, 27, 22, 0.09);
      --good: #15673d;
      --bad: #b03d2f;
      --accent: #0f6c7a;
      --shadow: 0 18px 36px rgba(50, 36, 23, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: linear-gradient(180deg, #f8f3ec 0%, #eee5d6 100%); }
    .shell { max-width: 1360px; margin: 0 auto; padding: 24px; }
    .nav, .hero, .cards { display: grid; gap: 16px; }
    .nav { grid-template-columns: 1fr auto auto; align-items: center; margin-bottom: 18px; }
    .hero { grid-template-columns: 2fr 1fr; margin-bottom: 18px; }
    .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel { background: var(--panel); border: 1px solid rgba(255,255,255,0.55); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; backdrop-filter: blur(14px); }
    .brand { font-size: 2rem; margin: 0; letter-spacing: -0.04em; }
    .link { text-decoration: none; color: var(--ink); padding: 12px 16px; border-radius: 999px; background: rgba(32,27,22,0.06); }
    .eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px; }
    .headline { font-size: clamp(2.4rem, 5vw, 4.4rem); margin: 0 0 10px; line-height: 0.95; }
    .subhead { margin: 0; color: var(--muted); max-width: 62ch; }
    .big { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.04em; }
    .service-card { display: grid; gap: 16px; }
    .service-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 12px; font-size: 0.88rem; background: rgba(32,27,22,0.06); }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--bad); }
    .badge.good .dot { background: var(--good); }
    .mini { color: var(--muted); font-size: 0.92rem; }
    .stack { display: grid; gap: 8px; }
    .status-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
    @media (max-width: 1080px) { .hero, .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <h1 class="brand">{{.PageTitle}}</h1>
      <a class="link" href="/">Home</a>
      <a class="link" href="/services">Service List</a>
    </nav>

    <section class="hero">
      <div class="panel">
        <div class="eyebrow">Overview</div>
        <h2 class="headline">Every service on one screen.</h2>
        <p class="subhead">Green means the service is reachable and all reported connection states are healthy. Red means the service is down or at least one underlying connection is broken.</p>
      </div>
      <div class="panel">
        <div class="eyebrow">Refreshed</div>
        <div class="big" id="refreshedAt">Waiting...</div>
        <div class="mini" id="summaryLine">Loading service fleet status</div>
      </div>
    </section>

    <section class="cards" id="serviceCards"></section>
  </div>

  <script>
    function formatDate(value) {
      if (!value) return "N/A";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "N/A";
      return date.toLocaleString();
    }

    async function refresh() {
      const response = await fetch("/api/services", { cache: "no-store" });
      const data = await response.json();
      const services = data.services || [];
      const healthyCount = services.filter(service => service.healthy).length;

      document.getElementById("refreshedAt").textContent = services.length ? formatDate(new Date()) : "Waiting...";
      document.getElementById("summaryLine").textContent = `${healthyCount}/${services.length} services fully healthy`;

      const root = document.getElementById("serviceCards");
      root.innerHTML = services.map(service => {
        const status = service.healthy ? "good" : "";
        const label = service.healthy ? "Healthy" : "Attention";
        const summaryFields = service.summary_fields || [];
        const summaryRows = summaryFields.slice(0, 6).map(field =>
          `<div class="status-row"><span>${field.label}</span><strong>${field.value}</strong></div>`
        ).join("");
        const lastError = service.last_error ? `<div class="mini">Error: ${service.last_error}</div>` : `<div class="mini">No source error reported</div>`;
        return `
          <article class="panel service-card">
            <div class="service-head">
              <div>
                <div class="eyebrow">Service</div>
                <div class="big">${service.name}</div>
              </div>
              <div class="badge ${status}"><span class="dot"></span><span>${label}</span></div>
            </div>
            <div class="stack">
              ${summaryRows || '<div class="mini">No service metrics yet</div>'}
            </div>
            ${lastError}
            <a class="link" href="/services/${service.id}">Open detail page</a>
          </article>
        `;
      }).join("");
    }

    refresh().catch(console.error);
    setInterval(() => refresh().catch(console.error), 2000);
  </script>
</body>
</html>
