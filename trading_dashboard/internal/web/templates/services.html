<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.PageTitle}} - Services</title>
  <style>
    :root {
      --bg: #f5efe6;
      --panel: rgba(255,255,255,0.8);
      --ink: #201b16;
      --muted: #71675d;
      --good: #15673d;
      --bad: #b03d2f;
      --line: rgba(32, 27, 22, 0.09);
      --shadow: 0 18px 36px rgba(50, 36, 23, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: linear-gradient(180deg, #f8f3ec 0%, #eee5d6 100%); }
    .shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .nav { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; margin-bottom: 18px; }
    .brand { font-size: 2rem; margin: 0; letter-spacing: -0.04em; }
    .link { text-decoration: none; color: var(--ink); padding: 12px 16px; border-radius: 999px; background: rgba(32,27,22,0.06); }
    .panel { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; }
    .eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 0; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 12px; background: rgba(32,27,22,0.06); }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--bad); }
    .good .dot { background: var(--good); }
    .mini { color: var(--muted); font-size: 0.92rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { border: 0; border-radius: 999px; padding: 9px 14px; font: inherit; cursor: pointer; background: rgba(32,27,22,0.08); color: var(--ink); }
    .action-btn:disabled { cursor: not-allowed; opacity: 0.45; }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <h1 class="brand">{{.PageTitle}}</h1>
      <a class="link" href="/">Home</a>
      <a class="link" href="/services">Service List</a>
    </nav>

    <section class="panel">
      <div class="eyebrow">All Services</div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Flow Summary</th>
            <th>Last Updated</th>
            <th>Controls</th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody id="serviceRows"></tbody>
      </table>
    </section>
  </div>

  <script>
    function formatDate(value) {
      if (!value) return "N/A";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "N/A";
      return date.toLocaleString();
    }

    function compactSummary(fields) {
      return (fields || []).slice(0, 3).map(field => `${field.label}: ${field.value}`).join(" | ");
    }

    async function runAction(serviceId, action, button) {
      const original = button.textContent;
      button.disabled = true;
      button.textContent = action === "start" ? "Starting..." : "Stopping...";
      try {
        const response = await fetch(`/api/actions/${serviceId}/${action}`, { method: "POST" });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          throw new Error(data.error || data.output || `Failed to ${action}`);
        }
        await refresh();
      } catch (error) {
        window.alert(error.message || `Failed to ${action} service`);
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    }

    async function refresh() {
      const response = await fetch("/api/services", { cache: "no-store" });
      const data = await response.json();
      const services = data.services || [];
      document.getElementById("serviceRows").innerHTML = services.map(service => `
        <tr>
          <td>${service.name}</td>
          <td><span class="badge ${service.healthy ? 'good' : ''}"><span class="dot"></span><span>${service.healthy ? 'Healthy' : 'Attention'}</span></span></td>
          <td><span class="mini">${compactSummary(service.summary_fields)}</span></td>
          <td>${formatDate(service.last_updated_at)}</td>
          <td>
            <div class="actions">
              <button class="action-btn" ${service.start_allowed ? "" : "disabled"} onclick="runAction('${service.id}', 'start', this)">Start</button>
              <button class="action-btn" ${service.stop_allowed ? "" : "disabled"} onclick="runAction('${service.id}', 'stop', this)">Stop</button>
            </div>
          </td>
          <td><a class="link" href="/services/${service.id}">Detail</a></td>
        </tr>
      `).join("");
    }

    refresh().catch(console.error);
    setInterval(() => refresh().catch(console.error), 2000);
  </script>
</body>
</html>
